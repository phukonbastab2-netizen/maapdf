plugins { id 'com.android.application' }
android {
 namespace 'in.sahayak.documents'
 compileSdk 35
 defaultConfig { applicationId 'in.sahayak.documents'; minSdk 26; targetSdk 35; versionCode 3; versionName '3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 splits { abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64'; universalApk false } }
}
dependencies {
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
 implementation 'com.google.mlkit:translate:17.0.3'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
